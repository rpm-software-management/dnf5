# Packages whose installation or upgrade suggests a system reboot.
#
# One package name per line. Empty lines and lines starting with '#' are
# ignored. Names that are not installed are ignored.
#
# This file is provided by libdnf5. To adjust the list locally, create a file
# in /etc/dnf/suggest-reboot.d/; a file with the same name as one here replaces
# it entirely, while a file with a different name adds to the list.
#
# See https://access.redhat.com/solutions/27943. These packages should all also
# have a reboot_suggested advisory, but they are handled explicitly to be sure.

